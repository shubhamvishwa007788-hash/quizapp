<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiztext — pick a language, run the tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1a1b26;
    --bg-panel: #1f2133;
    --bg-raised: #262838;
    --line: #33364d;
    --fg: #cdd0e3;
    --fg-dim: #7a7ea3;
    --fg-faint: #4c5073;
    --green: #9ece6a;
    --red: #f7768e;
    --amber: #e0af68;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;

    --accent: #7aa2f7;
    --accent-dim: rgba(122,162,247,0.14);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  ::selection{ background: var(--accent-dim); color: var(--fg); }

  .app{
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }
  .titlebar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 22px;
  }
  .dots{ display:flex; gap:6px; }
  .dot{ width:10px; height:10px; border-radius:50%; }
  .dot.r{ background:#f7768e33; border:1px solid #f7768e88;}
  .dot.y{ background:#e0af6833; border:1px solid #e0af6888;}
  .dot.g{ background:#9ece6a33; border:1px solid #9ece6a88;}
  .titlebar .path{
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--fg-dim);
    letter-spacing: 0.02em;
  }
  .titlebar .path b{ color: var(--fg); font-weight:600; }


  .tabs{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 0;
    margin-bottom: 22px;
  }
  .tab{
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--fg-dim);
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-bottom: none;
    padding: 9px 14px 8px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    display:flex;
    align-items:center;
    gap:7px;
    transform: translateY(1px);
    transition: color .15s ease, background .15s ease;
  }
  .tab:hover{ color: var(--fg); }
  .tab .sq{ width:8px; height:8px; border-radius:2px; flex:none; }
  .tab.active{
    color: var(--fg);
    background: var(--bg-panel);
    border-color: var(--line);
    border-bottom: 2px solid var(--tab-color, var(--accent));
    transform: translateY(2px);
  }

  /* ---------- panel ---------- */
  .panel{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  /* ---- picker screen ---- */
  .picker{ padding: 34px 30px 38px; }
  .picker h1{
    font-family: var(--mono);
    font-size: 20px;
    margin: 0 0 6px;
    color: var(--fg);
  }
  .picker h1 .kw{ color: var(--accent); }
  .picker .sub{
    color: var(--fg-dim);
    font-size: 14.5px;
    margin: 0 0 26px;
    line-height:1.5;
  }
  .lang-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  @media (max-width: 480px){ .lang-grid{ grid-template-columns: 1fr; } }
  .lang-card{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 14px 15px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    text-align:left;
    transition: border-color .15s ease, transform .15s ease;
  }
  .lang-card:hover{ transform: translateY(-1px); }
  .lang-card .chip{
    width: 34px; height: 34px;
    border-radius: 7px;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--mono);
    font-weight: 800;
    font-size: 13px;
    flex: none;
    color: #1a1b26;
  }
  .lang-card .meta .name{
    font-family: var(--mono);
    font-weight: 600;
    font-size: 14.5px;
    color: var(--fg);
  }
  .lang-card .meta .count{
    font-size: 12px;
    color: var(--fg-dim);
    margin-top: 2px;
  }
  .quizhead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 16px 22px;
    border-bottom: 2px solid var(--line);
  }
  .quizhead .qcount{
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--fg-dim);
  }
  .quizhead .score{
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--fg-dim);
  }
  .quizhead .score b{ color: var(--green); }
  .progress{
    height: 3px;
    background: var(--line);
  }
  .progress .fill{
    height: 100%;
    background: var(--tab-color, var(--accent));
    transition: width .3s ease;
  }

  .qwrap{ padding: 26px 26px 24px; }
  .qeyebrow{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--fg-faint);
    margin-bottom: 10px;
  }
  .qtext{
    font-family: var(--mono);
    font-size: 16px;
    line-height: 1.55;
    color: var(--fg);
    margin: 0 0 22px;
    white-space: pre-wrap;
  }
  .qtext .cm{ color: var(--fg-dim); }

  .options{ display:flex; flex-direction:column; gap:9px; }
  .opt{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    text-align:left;
    width:100%;
    padding: 12px 14px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--fg);
    transition: border-color .12s ease, background .12s ease;
  }
  .opt:hover:not(:disabled){ border-color: var(--fg-faint); }
  .opt .letter{
    font-weight:700;
    color: var(--fg-dim);
    flex: none;
  }
  .opt:disabled{ cursor: default; }
  .opt.correct{
    border-color: var(--green);
    background: rgba(158,206,106,0.10);
  }
  .opt.correct .letter{ color: var(--green); }
  .opt.wrong{
    border-color: var(--red);
    background: rgba(247,118,142,0.10);
  }
  .opt.wrong .letter{ color: var(--red); }
  .opt.dim{ opacity: 0.45; }

  .feedback{
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback .verdict{
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 6px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .feedback.ok .verdict{ color: var(--green); }
  .feedback.bad .verdict{ color: var(--red); }
  .feedback .exp{
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--fg-dim);
  }
  .feedback .exp .rem{
    font-family: var(--mono);
    color: var(--fg-faint);
  }

  .qfoot{
    display:flex;
    justify-content: flex-end;
    padding: 0 26px 26px;
  }
  .btn{
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: #1a1b26;
    background: var(--tab-color, var(--accent));
    border: none;
    padding: 11px 20px;
    border-radius: 7px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease, transform .1s ease;
  }
  .btn.show{ opacity:1; pointer-events:auto; }
  .btn:active{ transform: scale(0.97); }
  .btn.ghost{
    background: transparent;
    color: var(--fg-dim);
    border: 1px solid var(--line);
    opacity: 1;
    pointer-events: auto;
  }
  .btn.ghost:hover{ color: var(--fg); border-color: var(--fg-faint); }

  /* ---- results screen ---- */
  .results{ padding: 40px 30px 36px; text-align:center; }
  .results .term{
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--fg-dim);
    text-align:left;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 26px;
    line-height: 1.8;
  }
  .results .term .p{ color: var(--fg-faint); }
  .results .term .ok{ color: var(--green); }
  .results .bignum{
    font-family: var(--mono);
    font-weight: 800;
    font-size: 52px;
    color: var(--fg);
    line-height:1;
  }
  .results .bignum span{ font-size: 24px; color: var(--fg-dim); font-weight:600; }
  .results .msg{
    font-size: 14.5px;
    color: var(--fg-dim);
    margin: 10px 0 28px;
  }
  .results .btnrow{
    display:flex;
    gap: 10px;
    justify-content:center;
    flex-wrap: wrap;
  }
  .results .btn{ opacity:1; pointer-events:auto; }

  .hidden{ display:none !important; }

  footer{
    text-align:center;
    color: var(--fg-faint);
    font-family: var(--mono);
    font-size: 11.5px;
    margin-top: 22px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="titlebar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="path">~/<b id="pathLang">Quiz</b></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="panel">
    
    <div class="picker" id="picker">
      <h1><span class="kw">welcome</span> quiz = <span class="kw">new</span> Quiz;</h1>
      <p class="sub">Pick a language below. Four options per question, one right answer</p>
      <div class="lang-grid" id="langGrid"></div>
    </div>
    <div class="hidden" id="quizScreen">
      <div class="quizhead">
        <div class="qcount" id="qCount">Question 1 / 12</div>
        <div class="score">score: <b id="scoreVal">0</b></div>
      </div>
      <div class="progress"><div class="fill" id="progressFill" style="width:0%"></div></div>
      <div class="qwrap">
        <div class="qeyebrow" id="qEyebrow">// javascript</div>
        <div class="qtext" id="qText"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback">
          <div class="verdict" id="verdict"></div>
          <div class="exp" id="exp"></div>
        </div>
      </div>
      <div class="qfoot">
        <button class="btn ghost hidden" id="quitBtn">Quit</button>
        <button class="btn" id="nextBtn" style="margin-left:10px;">next →</button>
      </div>
    </div>
    <div class="hidden" id="resultsScreen">
      <div class="results">
        <div class="term" id="termLog"></div>
        <div class="bignum" id="finalScore">0<span>/12</span></div>
        <div class="msg" id="finalMsg">nice work keep on.</div>
        <div class="btnrow">
          <button class="btn ghost" id="chooseBtn"> if you choose another language</button>
          <button class="btn" id="retryBtn" style="opacity:1;pointer-events:auto;">retry this set</button>
        </div>
      </div>
    </div>
  </div>

  <footer>run tests → read the diff → learn something</footer>
</div>

<script>

const BANK = {
  "js": {
    "name": "JavaScript",
    "short": "JS",
    "color": "#e0af68",
    "q": [
      {
        "q": "What does `typeof NaN` return?",
        "o": [
          "\"number\"",
          "\"NaN\"",
          "\"undefined\"",
          "\"object\""
        ],
        "a": 0,
        "e": "NaN stands for 'Not a Number', but ironically its type IS \"number\" — it's just a special numeric value representing an invalid result."
      },
      {
        "q": "Which method adds one or more elements to the end of an array?",
        "o": [
          ".append()",
          ".push()",
          ".add()",
          ".concat()"
        ],
        "a": 1,
        "e": ".push() mutates the array in place and adds to the end. .concat() returns a new array instead of mutating."
      },
      {
        "q": "What is the output of `[] + []` in JavaScript?",
        "o": [
          "[]",
          "0",
          "\"\" (empty string)",
          "undefined"
        ],
        "a": 2,
        "e": "Both arrays are coerced to strings (\"\") and concatenated, producing an empty string."
      },
      {
        "q": "Which keyword declares a block-scoped variable that can be reassigned?",
        "o": [
          "const",
          "var",
          "let",
          "static"
        ],
        "a": 2,
        "e": "let is block-scoped and reassignable. const is block-scoped but not reassignable; var is function-scoped."
      },
      {
        "q": "What does `===` check that `==` does not?",
        "o": [
          "Variable name",
          "Type, in addition to value",
          "Memory address",
          "Nothing, they're identical"
        ],
        "a": 1,
        "e": "=== is strict equality: it compares both value and type without coercion. == allows type coercion before comparing."
      },
      {
        "q": "What will `console.log(typeof null)` print?",
        "o": [
          "\"null\"",
          "\"undefined\"",
          "\"object\"",
          "\"boolean\""
        ],
        "a": 2,
        "e": "This is a famous JS quirk — typeof null returns \"object\" due to a legacy bug that was never fixed."
      },
      {
        "q": "Which array method creates a new array with results of calling a function on every element?",
        "o": [
          ".forEach()",
          ".map()",
          ".filter()",
          ".reduce()"
        ],
        "a": 1,
        "e": ".map() transforms each element and returns a new array. .forEach() returns undefined; .filter() selects elements."
      },
      {
        "q": "What is a closure?",
        "o": [
          "A syntax error",
          "A function bundled with its lexical scope",
          "A loop that never ends",
          "A way to close a file"
        ],
        "a": 1,
        "e": "A closure lets an inner function remember variables from its outer function's scope even after that function returns."
      },
      {
        "q": "What does `Array.isArray([1,2,3])` return?",
        "o": [
          "true",
          "false",
          "\"array\"",
          "undefined"
        ],
        "a": 0,
        "e": "Array.isArray() correctly identifies actual arrays, more reliable than typeof (which returns \"object\")."
      },
      {
        "q": "What value does an `async` function always return?",
        "o": [
          "A callback",
          "A Promise",
          "undefined",
          "The awaited value directly"
        ],
        "a": 1,
        "e": "async functions always wrap their return value in a Promise, even if you return a plain value."
      },
      {
        "q": "Which of these correctly checks if a variable is undefined?",
        "o": [
          "x = undefined",
          "x == undefined",
          "typeof x === 'undefined'",
          "x.isUndefined()"
        ],
        "a": 2,
        "e": "typeof x === 'undefined' is safest because it won't throw even if x was never declared."
      },
      {
        "q": "What does the spread operator `...` do to an array `[1,2,3]`?",
        "o": [
          "Sorts it",
          "Expands its elements individually",
          "Deletes it",
          "Reverses it"
        ],
        "a": 1,
        "e": "Spread unpacks array elements individually — useful for copying, merging, or passing as function arguments."
      },
      {
        "q": "What does `JSON.stringify()` do?",
        "o": [
          "Parses a JSON string into an object",
          "Converts a JS value into a JSON string",
          "Validates JSON syntax",
          "Deletes JSON keys"
        ],
        "a": 1,
        "e": "JSON.stringify() serializes a JavaScript object or value into a JSON-formatted string."
      },
      {
        "q": "What is the result of `2 + '2'` in JavaScript?",
        "o": [
          "4",
          "\"22\"",
          "NaN",
          "Error"
        ],
        "a": 1,
        "e": "The number 2 is coerced to a string and concatenated with '2', producing the string \"22\"."
      },
      {
        "q": "Which method removes the last element from an array?",
        "o": [
          ".shift()",
          ".pop()",
          ".remove()",
          ".splice(0)"
        ],
        "a": 1,
        "e": ".pop() removes and returns the last element of an array. .shift() removes the first element instead."
      },
      {
        "q": "What does `let` provide that `var` does not?",
        "o": [
          "Global scope",
          "Block scope",
          "Faster execution",
          "Automatic type conversion"
        ],
        "a": 1,
        "e": "let is scoped to the nearest enclosing block ({}), while var is function-scoped and ignores block boundaries."
      },
      {
        "q": "What is the purpose of the `this` keyword in a regular function?",
        "o": [
          "Always refers to the global object",
          "Refers to the object that called the function",
          "Refers to the function itself",
          "Is always undefined"
        ],
        "a": 1,
        "e": "In a regular function, `this` is determined by how the function is called — typically the object it's invoked on."
      },
      {
        "q": "What does `Object.keys(obj)` return?",
        "o": [
          "The values of an object",
          "An array of the object's own enumerable property names",
          "The object's prototype",
          "A boolean"
        ],
        "a": 1,
        "e": "Object.keys() returns an array containing the object's own enumerable property names as strings."
      },
      {
        "q": "What is event bubbling in the DOM?",
        "o": [
          "Events firing in random order",
          "An event propagating from the target element up through its ancestors",
          "A memory leak pattern",
          "A CSS animation technique"
        ],
        "a": 1,
        "e": "Event bubbling means an event triggered on a child element also fires on its parent elements, moving up the DOM tree."
      },
      {
        "q": "What does the `??` (nullish coalescing) operator do?",
        "o": [
          "Returns the right operand only if the left is null or undefined",
          "Performs logical AND",
          "Compares types strictly",
          "Throws an error on null"
        ],
        "a": 0,
        "e": "?? returns the right-hand value only when the left is null or undefined, unlike || which also triggers on falsy values like 0 or ''."
      },
      {
        "q": "What does `Array.prototype.reduce()` do?",
        "o": [
          "Removes duplicate elements",
          "Reduces an array to a single accumulated value",
          "Sorts the array in place",
          "Splits an array into chunks"
        ],
        "a": 1,
        "e": "reduce() applies a function against an accumulator and each element to reduce the array to a single value."
      },
      {
        "q": "What is a Promise in JavaScript?",
        "o": [
          "A synchronous function call",
          "An object representing the eventual result of an async operation",
          "A type of loop",
          "A CSS property"
        ],
        "a": 1,
        "e": "A Promise represents a value that may be available now, later, or never, from an asynchronous operation."
      },
      {
        "q": "What does `Array.prototype.find()` return when no element matches?",
        "o": [
          "null",
          "undefined",
          "-1",
          "an empty array"
        ],
        "a": 1,
        "e": "find() returns undefined if no element in the array satisfies the provided testing function, unlike indexOf which returns -1."
      },
      {
        "q": "What is the difference between `null` and `undefined`?",
        "o": [
          "They are exactly the same",
          "undefined means a variable was declared but not assigned; null is an explicit 'no value'",
          "null is a data type; undefined is not",
          "There is no difference in modern JS"
        ],
        "a": 1,
        "e": "undefined is the default value of uninitialized variables, while null is explicitly assigned to represent 'no value'."
      },
      {
        "q": "What does the `map` data structure in JS allow as keys, unlike plain objects?",
        "o": [
          "Only strings",
          "Any value, including objects and functions",
          "Only numbers",
          "Nothing different"
        ],
        "a": 1,
        "e": "A Map can use any value — objects, functions, even NaN — as a key, while plain object keys are coerced to strings."
      },
      {
        "q": "What does `Array.prototype.some()` return?",
        "o": [
          "The first matching element",
          "true if at least one element passes the test, otherwise false",
          "The count of matching elements",
          "A new filtered array"
        ],
        "a": 1,
        "e": "some() tests whether at least one element in the array passes the provided function, returning a boolean."
      },
      {
        "q": "What is 'hoisting' in JavaScript?",
        "o": [
          "Moving code to a CDN",
          "Variable and function declarations being moved to the top of their scope during compilation",
          "A CSS layout technique",
          "Deleting unused variables"
        ],
        "a": 1,
        "e": "Hoisting means declarations (not initializations) are conceptually moved to the top of their scope before code executes."
      },
      {
        "q": "What does the `try...catch` block do?",
        "o": [
          "Prevents all errors from ever happening",
          "Lets you handle errors gracefully without crashing the program",
          "Only works with async code",
          "Automatically fixes bugs"
        ],
        "a": 1,
        "e": "try...catch lets you attempt code that might throw an error and handle that error instead of letting it crash the program."
      },
      {
        "q": "What does `Array.prototype.slice()` do?",
        "o": [
          "Mutates the original array by removing elements",
          "Returns a shallow copy of a portion of an array without mutating it",
          "Sorts the array",
          "Joins array elements into a string"
        ],
        "a": 1,
        "e": "slice() returns a new array containing a portion of the original, leaving the original array unchanged."
      },
      {
        "q": "What is a template literal in JavaScript?",
        "o": [
          "A CSS template",
          "A string literal allowing embedded expressions, using backticks",
          "A type of loop",
          "A JSON schema"
        ],
        "a": 1,
        "e": "Template literals use backticks (`) and allow embedded expressions with ${} syntax, e.g. `Hello, ${name}`."
      },
      {
        "q": "What does `Array.prototype.includes()` check?",
        "o": [
          "If an array is empty",
          "Whether an array contains a certain value",
          "The array's length",
          "If an array is sorted"
        ],
        "a": 1,
        "e": "includes() returns true or false depending on whether the array contains the specified value."
      },
      {
        "q": "What is the output of `typeof function(){}`?",
        "o": [
          "\"object\"",
          "\"function\"",
          "\"undefined\"",
          "\"method\""
        ],
        "a": 1,
        "e": "Functions have their own typeof result in JavaScript: \"function\", even though they are technically objects."
      },
      {
        "q": "What does `Object.freeze()` do to an object?",
        "o": [
          "Deletes all its properties",
          "Prevents new properties from being added and existing ones from being modified",
          "Converts it to a string",

const tabsEl = document.getElementById('tabs');
const langGridEl = document.getElementById('langGrid');
const pickerEl = document.getElementById('picker');
const quizScreenEl = document.getElementById('quizScreen');
const resultsScreenEl = document.getElementById('resultsScreen');
const pathLangEl = document.getElementById('pathLang');

const qCountEl = document.getElementById('qCount');
const scoreValEl = document.getElementById('scoreVal');
const progressFillEl = document.getElementById('progressFill');
const qEyebrowEl = document.getElementById('qEyebrow');
const qTextEl = document.getElementById('qText');
const optionsEl = document.getElementById('options');
const feedbackEl = document.getElementById('feedback');
const verdictEl = document.getElementById('verdict');
const expEl = document.getElementById('exp');
const nextBtn = document.getElementById('nextBtn');
const quitBtn = document.getElementById('quitBtn');

const termLogEl = document.getElementById('termLog');
const finalScoreEl = document.getElementById('finalScore');
const finalMsgEl = document.getElementById('finalMsg');
const chooseBtn = document.getElementById('chooseBtn');
const retryBtn = document.getElementById('retryBtn');

/* ============ Build language keys incl. Mixed ============ */
const LANG_KEYS = Object.keys(BANK);

function buildTabs(){
  tabsEl.innerHTML = '';
  const entries = [...LANG_KEYS.map(k => [k, BANK[k]]), ['mixed', { name: 'Mixed', short: 'ALL', color: '#c0caf5' }]];
  entries.forEach(([key, lang]) => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (key === currentLangKey ? ' active' : '');
    tab.style.setProperty('--tab-color', lang.color);
    tab.innerHTML = `<span class="sq" style="background:${lang.color}"></span>${lang.short}`;
    tab.addEventListener('click', () => startQuiz(key));
    tabsEl.appendChild(tab);
  });
}

function buildPicker(){
  langGridEl.innerHTML = '';
  LANG_KEYS.forEach(key => {
    const lang = BANK[key];
    const card = document.createElement('button');
    card.className = 'lang-card';
    card.innerHTML = `
      <div class="chip" style="background:${lang.color}">${lang.short}</div>
      <div class="meta">
        <div class="name">${lang.name}</div>
        <div class="count">${lang.q.length} questions</div>
      </div>`;
    card.addEventListener('click', () => startQuiz(key));
    langGridEl.appendChild(card);
  });
  const mixedCard = document.createElement('button');
  mixedCard.className = 'lang-card';
  const totalQ = LANG_KEYS.reduce((s,k) => s + BANK[k].q.length, 0);
  mixedCard.innerHTML = `
    <div class="chip" style="background:#c0caf5">ALL</div>
    <div class="meta">
      <div class="name">Mixed — All Languages</div>
      <div class="count">25 random from ${totalQ}</div>
    </div>`;
  mixedCard.addEventListener('click', () => startQuiz('mixed'));
  langGridEl.appendChild(mixedCard);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz(key){
  currentLangKey = key;
  document.documentElement.style.setProperty('--accent', getColor(key));

  if(key === 'mixed'){
    let all = [];
    LANG_KEYS.forEach(k => {
      BANK[k].q.forEach(q => all.push({...q, langName: BANK[k].name, langColor: BANK[k].color}));
    });
    questions = shuffle(all).slice(0, 25);
    pathLangEl.textContent = 'mixed.quiz';
  } else {
    const lang = BANK[key];
    questions = lang.q.map(q => ({...q, langName: lang.name, langColor: lang.color}));
    pathLangEl.textContent = key + '.quiz';
  }

  idx = 0;
  score = 0;
  answered = false;

  buildTabs();
  pickerEl.classList.add('hidden');
  resultsScreenEl.classList.add('hidden');
  quizScreenEl.classList.remove('hidden');

  renderQuestion();
}

function getColor(key){
  if(key === 'mixed') return '#c0caf5';
  return BANK[key].color;
}

function renderQuestion(){
  answered = false;
  const q = questions[idx];
  const total = questions.length;

  qCountEl.textContent = `Question ${idx + 1} / ${total}`;
  scoreValEl.textContent = score;
  progressFillEl.style.width = `${(idx / total) * 100}%`;
  qEyebrowEl.textContent = `// ${q.langName || BANK[currentLangKey].name}`;
  document.documentElement.style.setProperty('--tab-color', q.langColor || getColor(currentLangKey));

  qTextEl.textContent = q.q;

  optionsEl.innerHTML = '';
  const letters = ['a', 'b', 'c', 'd'];
  q.o.forEach((optText, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="letter">${letters[i]})</span><span>${escapeHtml(optText)}</span>`;
    btn.addEventListener('click', () => selectAnswer(i));
    optionsEl.appendChild(btn);
  });

  feedbackEl.classList.remove('show', 'ok', 'bad');
  nextBtn.classList.remove('show');
  nextBtn.textContent = idx === total - 1 ? 'see results →' : 'next →';
  quitBtn.classList.toggle('hidden', idx === 0);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function selectAnswer(choiceIdx){
  if(answered) return;
  answered = true;

  const q = questions[idx];
  const opts = optionsEl.querySelectorAll('.opt');
  const correct = choiceIdx === q.a;

  opts.forEach((el, i) => {
    el.disabled = true;
    if(i === q.a) el.classList.add('correct');
    else if(i === choiceIdx) el.classList.add('wrong');
    else el.classList.add('dim');
  });

  if(correct){
    score++;
    scoreValEl.textContent = score;
    feedbackEl.classList.add('show', 'ok');
    verdictEl.innerHTML = '✓ correct';
  } else {
    feedbackEl.classList.add('show', 'bad');
    verdictEl.innerHTML = '✕ incorrect';
  }
  expEl.innerHTML = `<span class="rem">/* explanation */</span> ${escapeHtml(q.e)}`;

  progressFillEl.style.width = `${((idx + 1) / questions.length) * 100}%`;
  nextBtn.classList.add('show');
}

nextBtn.addEventListener('click', () => {
  if(!answered) return;
  if(idx < questions.length - 1){
    idx++;
    renderQuestion();
  } else {
    showResults();
  }
});

quitBtn.addEventListener('click', () => {
  quizScreenEl.classList.add('hidden');
  pickerEl.classList.remove('hidden');
  currentLangKey = null;
  pathLangEl.textContent = 'lang.quiz';
  document.documentElement.style.setProperty('--accent', '#7aa2f7');
  buildTabs();
});

function showResults(){
  quizScreenEl.classList.add('hidden');
  resultsScreenEl.classList.remove('hidden');

  const total = questions.length;
  const pct = Math.round((score / total) * 100);

  finalScoreEl.innerHTML = `${score}<span>/${total}</span>`;

  let msg;
  if(pct === 100) msg = "Perfect run — every test passed.";
  else if(pct >= 80) msg = "Strong result. Barely any red in that log.";
  else if(pct >= 50) msg = "Solid attempt — a few concepts worth revisiting.";
  else msg = "Rough build — worth another pass through the docs.";
  finalMsgEl.textContent = msg;

  const langLabel = currentLangKey === 'mixed' ? 'mixed' : BANK[currentLangKey].name.toLowerCase();
  termLogEl.innerHTML =
    `<span class="p">$</span> run ${escapeHtml(langLabel)}-quiz.test<br>` +
    `<span class="p">></span> ${total} tests executed<br>` +
    `<span class="ok">></span> ${score} passed, ${total - score} failed<br>` +
    `<span class="p">></span> score: ${pct}%`;
}

chooseBtn.addEventListener('click', () => {
  resultsScreenEl.classList.add('hidden');
  pickerEl.classList.remove('hidden');
  currentLangKey = null;
  pathLangEl.textContent = 'lang.quiz';
  document.documentElement.style.setProperty('--accent', '#7aa2f7');
  buildTabs();
});

retryBtn.addEventListener('click', () => {
  startQuiz(currentLangKey);
});


buildTabs();
buildPicker();
</script>


</body>
</html>
